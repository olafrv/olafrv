name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        run: corepack enable

      # Runs before install: needs no dependencies and should fail fast.
      # See PNPM_SECURITY.md -> Enforced Security Measures -> 9. CI/CD Checks.
      - name: Policy deny-rule guard
        run: pnpm run check:deny-rules

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Audit
        run: pnpm audit --audit-level=moderate
