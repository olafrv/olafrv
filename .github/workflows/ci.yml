name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable corepack
        run: corepack enable

      # Runs before install: needs no dependencies and should fail fast.
      # See PNPM_SECURITY.md -> Enforced Security Measures -> 9. CI/CD Checks.
      - name: Policy deny-rule guard
        run: pnpm run check:deny-rules

      # Fails if engines.node is stale relative to .nvmrc, i.e. someone edited
      # .nvmrc without re-syncing. See PNPM_SECURITY.md -> 9. CI/CD Checks.
      - name: Node-pin sync
        run: pnpm run sync:node-pin && git diff --exit-code package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Audit
        run: pnpm audit --audit-level=moderate
